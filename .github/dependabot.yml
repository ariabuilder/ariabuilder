version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Toronto
    # Keep automated vulnerability fixes without opening routine version PRs.
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /tests/fixtures/astro-smoke
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Toronto
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Toronto
    open-pull-requests-limit: 0
