name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install Electron runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libnss3 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libxkbcommon0 \
            libgbm1 \
            libgtk-3-0 \
            libx11-xcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libcups2
          sudo apt-get install -y weston libfuse2t64 || sudo apt-get install -y weston libfuse2
          # Package renamed on Ubuntu 24.04 (t64 transition).
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - run: npm ci

      - name: Verify third-party notices
        run: npm run licenses:check

      - name: Install locked Astro smoke fixture
        working-directory: tests/fixtures/astro-smoke
        run: npm ci --ignore-scripts

      - name: Unit and runtime checks
        run: npm run test:all && npm run smoke:project && npm run smoke:runtime && npm run smoke:git

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Real Astro runtime smoke
        run: npm run smoke:real-astro
        env:
          ARIA_SMOKE_ASTRO_PROJECT: ${{ github.workspace }}/tests/fixtures/astro-smoke
          ARIA_SMOKE_COMPOSER_ROUTE: /
          ARIA_SMOKE_EXPECT_HTML: Aria packaged runtime smoke

      - name: Build Linux AppImage
        run: npm run dist:linux

      - name: Smoke AppImage under X11 with sandbox enabled
        run: xvfb-run -a npm run smoke:installed

      - name: Smoke AppImage under headless Wayland
        shell: bash
        run: |
          export XDG_RUNTIME_DIR="${RUNNER_TEMP}/aria-wayland"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=wayland-aria --idle-time=0 >"${RUNNER_TEMP}/weston.log" 2>&1 &
          WESTON_PID=$!
          trap 'kill "$WESTON_PID" || true' EXIT
          for attempt in {1..50}; do
            test -S "$XDG_RUNTIME_DIR/wayland-aria" && break
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/wayland-aria"
          WAYLAND_DISPLAY=wayland-aria ARIA_SMOKE_OZONE_PLATFORM=wayland npm run smoke:installed

      - name: Upload AppImage
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aria-linux-x64-unsigned-ci
          path: release/*.AppImage
          if-no-files-found: ignore
          retention-days: 1

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - run: npm ci

      - name: Install locked Astro smoke fixture
        working-directory: tests/fixtures/astro-smoke
        run: npm ci --ignore-scripts

      - name: Unit and runtime checks
        run: npm run test:all && npm run smoke:project && npm run smoke:runtime && npm run smoke:git

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Real Astro runtime smoke
        run: npm run smoke:real-astro
        env:
          ARIA_SMOKE_ASTRO_PROJECT: ${{ github.workspace }}\tests\fixtures\astro-smoke
          ARIA_SMOKE_COMPOSER_ROUTE: /
          ARIA_SMOKE_EXPECT_HTML: Aria packaged runtime smoke

      - name: Build Windows NSIS
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Smoke installed NSIS app with a real project
        run: npm run smoke:installed

      - name: Upload NSIS installer
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aria-windows-x64-unsigned-ci
          path: release/*.exe
          if-no-files-found: ignore
          retention-days: 1

  macos_arm64:
    name: macOS arm64
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - run: npm ci

      - name: Install locked Astro smoke fixture
        working-directory: tests/fixtures/astro-smoke
        run: npm ci --ignore-scripts

      - name: Unit and runtime checks
        run: npm run test:all && npm run smoke:project && npm run smoke:runtime && npm run smoke:git

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Real Astro runtime smoke
        run: npm run smoke:real-astro
        env:
          ARIA_SMOKE_ASTRO_PROJECT: ${{ github.workspace }}/tests/fixtures/astro-smoke
          ARIA_SMOKE_COMPOSER_ROUTE: /
          ARIA_SMOKE_EXPECT_HTML: Aria packaged runtime smoke

      - name: Build macOS dmg + zip
        run: npm run dist:mac:arm64
        env:
          # Unsigned CI builds — no Developer ID on the runner.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Smoke installed DMG app with a real project
        run: npm run smoke:installed

      - name: Upload macOS DMG
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aria-macos-arm64-unsigned-ci
          path: release/*.dmg
          if-no-files-found: ignore
          retention-days: 1

  macos_x64:
    name: macOS x64
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - run: npm ci

      - name: Install locked Astro smoke fixture
        working-directory: tests/fixtures/astro-smoke
        run: npm ci --ignore-scripts

      - name: Unit and runtime checks
        run: npm run test:all && npm run smoke:project && npm run smoke:runtime && npm run smoke:git

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Real Astro runtime smoke
        run: npm run smoke:real-astro
        env:
          ARIA_SMOKE_ASTRO_PROJECT: ${{ github.workspace }}/tests/fixtures/astro-smoke
          ARIA_SMOKE_COMPOSER_ROUTE: /
          ARIA_SMOKE_EXPECT_HTML: Aria packaged runtime smoke

      - name: Build macOS dmg + zip
        run: npm run dist:mac:x64
        env:
          # Unsigned CI builds — no Developer ID on the runner.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Smoke installed DMG app with a real project
        run: npm run smoke:installed

      - name: Upload macOS DMG
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aria-macos-x64-unsigned-ci
          path: release/*.dmg
          if-no-files-found: ignore
          retention-days: 1

  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs:
      - linux
      - windows
      - macos_arm64
      - macos_x64
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform job to succeed
        shell: bash
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          MACOS_ARM64_RESULT: ${{ needs.macos_arm64.result }}
          MACOS_X64_RESULT: ${{ needs.macos_x64.result }}
        run: |
          echo "Linux x64: $LINUX_RESULT"
          echo "Windows x64: $WINDOWS_RESULT"
          echo "macOS arm64: $MACOS_ARM64_RESULT"
          echo "macOS x64: $MACOS_X64_RESULT"
          test "$LINUX_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$MACOS_ARM64_RESULT" = success
          test "$MACOS_X64_RESULT" = success
